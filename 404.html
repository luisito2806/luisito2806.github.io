<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages distingue mayúsculas: /portafolio/ no es lo mismo que /Portafolio/.
    // Si la primera parte de la dirección coincide con un sitio publicado (sin importar
    // mayúsculas), se redirige a la dirección correcta conservando el resto.
    (function () {
      var sitios = ['Portafolio', 'Pingpon', 'duolingo-matematico', 'Tamagotchi-web', 'nav-bars', 'localstorage'];
      var partes = location.pathname.split('/');
      var primera = (partes[1] || '').toLowerCase();
      for (var i = 0; i < sitios.length; i++) {
        if (sitios[i].toLowerCase() === primera && sitios[i] !== partes[1]) {
          partes[1] = sitios[i];
          if (partes.length === 2) partes.push('');
          location.replace(partes.join('/') + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5f0; color: #22252a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    h1 { font-family: Georgia, serif; font-weight: 500; margin: 0 0 8px; }
    p { color: #5c626b; margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #1f6f5c; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Página no encontrada</h1>
    <p>Esta dirección no existe. Revisa que esté bien escrita.</p>
    <a href="/Portafolio/">Ir al portafolio de Luis Angel Vazquez Estrada</a>
  </main>
</body>
</html>
