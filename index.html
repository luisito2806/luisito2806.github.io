<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi CV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .cv-container {
      background-color: #ffffff;
      max-width: 800px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 3rem;
      color: #111;
      text-align: center;
      margin-bottom: 20px;
    }

    
    h2 {
      font-size: 2.5rem;
      color: #222;
      text-align: center;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    
    .contenido {
      display: flex;
      gap: 35px;
      align-items: flex-start;
    }

    
    .col-izquierda {
      flex: 0 0 200px;
      text-align: center;
    }

    .foto-cv {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      border: 3px solid #ddd;
    }

    .col-derecha {
      flex: 1;
    }

    .col-derecha h3 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 15px;
      border-bottom: 2px solid #222;
      padding-bottom: 5px;
    }

    .col-derecha p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #555;
    }

    @media (max-width: 600px) {
      .contenido {
        flex-direction: column;
        align-items: center;
      }
      .col-izquierda {
        flex: auto;
      }
    }
  </style>
</head>
<body>

  <div class="cv-container">
    <h1>MY CV</h1>
    
    
    <h2>Luis Angel Vazquez Estrada</h2>

    <div class="contenido">
      
      <div class="col-izquierda">
        
        <img class="foto-cv" src="tu-foto.jpg" alt="Foto de perfil">
      </div>

      
      <div class="col-derecha">
        <h3>Sobre mí</h3>
        <p>
          Descripcion 
        </p>
      </div>
    </div>
  </div>

</body>
</html>
